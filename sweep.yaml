program: train_gpt.py
method: grid
metric:
  name: val_loss
  goal: minimize
parameters:
  lookahead_steps:
    values: [10, 50, 100, 250, 500]
  outer_lr:
    values: [0.3, 0.5, 0.7, 0.9]
  outer_momentum:
    value: [0.8, 0.85, 0.9, 0.95]
  apply_lookahead:
    values: ["optimizer1", "optimizer2", "both"]
command:
  - ${env}
  - sudo
  - docker
  - run
  - -it
  - --rm
  - --gpus
  - all
  - -v
  - $(pwd):/modded-nanogpt
  - modded-nanogpt
  - sh
  - -c
  - "torchrun --standalone --nproc_per_node=8 wandb agent ${run}"
