program: train_gpt.py
method: grid
metric:
  name: val_loss
  goal: minimize
parameters:
  lookahead_steps:
    values: [50, 100, 250]
  outer_lr:
    values: [0.1, 0.3, 0.5, 0.7]
  outer_momentum:
    values: [0.85, 0.9, 0.95]
  apply_lookahead:
    values: ["optimizer1", "optimizer2", "both"]
command:
  - ${env}
  - sh
  - -c
  - "torchrun --standalone --nproc_per_node=8 train_gpt.py"
